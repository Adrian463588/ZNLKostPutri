name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: DevSecOps Security & Secret Audit
        run: npm run security:check

      - name: Dependency Vulnerability Audit (Advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Code Quality Check (Biome)
        run: npm run check

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: SEO Content & Asset Validation
        run: npm run seo:validate

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: npm run build

      - name: Post-Build SEO Audit
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run seo:audit
